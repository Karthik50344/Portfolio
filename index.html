<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Karthikeyan_Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Karthikeyan</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Prevent FOUC on web */
    body {
      background-color: #0A0A14;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #0A0A14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Courier New', monospace;
    }
    #loading h1 {
      color: #00D4FF;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0 0 8px;
    }
    #loading h3 {
      color: #00D4FF;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 0 0 8px;
    }
    #loading p {
      color: #555577;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin: 0;
    }
    .loader-bar {
      width: 200px;
      height: 2px;
      background: #1a1a2e;
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }
    .loader-fill {
      height: 100%;
      background: linear-gradient(90deg, #0060ff, #00D4FF);
      border-radius: 2px;
      animation: load 1.5s ease-in-out infinite;
    }
    @keyframes load {
      0% { width: 0%; transform: translateX(0); }
      50% { width: 70%; }
      100% { width: 100%; transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>KARTHIKEYAN</h1>
    <h3>FLUTTER DEVELOPER</h3>
    <p>INITIALIZING WIDGETS</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.4s ease';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
