<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Karthikeyan_Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Karthikeyan</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: #0A0A14;
      margin: 0;
      overflow: hidden;
    }

    /* Background Grid */
    #loading::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: moveGrid 10s linear infinite;
    }

    @keyframes moveGrid {
      from { transform: translateY(0); }
      to { transform: translateY(40px); }
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #0A0A14;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: 'Courier New', monospace;
    }

    /* Name */
    .name {
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 8px;
      text-transform: uppercase;
      animation: glow 2s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px #00D4FF,
          0 0 20px #00D4FF;
      }
      to {
        text-shadow:
          0 0 20px #00D4FF,
          0 0 40px #00D4FF,
          0 0 60px #00D4FF;
      }
    }

    .role {
      color: #777;
      letter-spacing: 5px;
      margin-top: 10px;
      font-size: 0.9rem;
      z-index: 2;
    }

    /* Typing Text */
    .terminal {
      margin-top: 40px;
      color: #00D4FF;
      font-size: 0.95rem;
      letter-spacing: 2px;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #00D4FF;
      width: 0;
      animation:
        typing 3s steps(30, end) forwards,
        blink .8s infinite;
      z-index: 2;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 330px }
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    /* Loader Bar */
    .loader-container {
      margin-top: 30px;
      width: 280px;
      z-index: 2;
    }

    .loader-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(
        90deg,
        #0060ff,
        #00D4FF,
        #00ffff
      );
      animation: progress 3s ease forwards;
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }

    .percentage {
      color: #888;
      margin-top: 10px;
      text-align: right;
      font-size: 12px;
    }

    /* Tech Stack */
    .stack {
      margin-top: 25px;
      color: #00D4FF;
      font-size: 0.85rem;
      letter-spacing: 2px;
      animation: pulse 2s infinite;
      z-index: 2;
    }

    @keyframes pulse {
      50% {
        opacity: 0.4;
      }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .name {
        font-size: 2rem;
        letter-spacing: 4px;
      }

      .terminal {
        font-size: 0.75rem;
      }

      .loader-container {
        width: 220px;
      }
    }
  </style>
</head>
<body>
<div id="loading">
  <div class="name">KARTHIKEYAN</div>

  <div class="role">
    FLUTTER • FASTAPI • FIREBASE
  </div>

  <div class="terminal">
    > Initializing Portfolio...
  </div>

  <div class="loader-container">
    <div class="loader-bar">
      <div class="loader-fill"></div>
    </div>

    <div class="percentage" id="percentage">
      0%
    </div>
  </div>

  <div class="stack">
    Loading Projects • Experience • Skills
  </div>
</div>

<script>
  let progress = 0;
  const percentage = document.getElementById('percentage');

  const timer = setInterval(() => {
    progress += 1;

    if (percentage) {
      percentage.innerText = progress + '%';
    }

    if (progress >= 100) {
      clearInterval(timer);
    }
  }, 30);

  window.addEventListener('flutter-first-frame', function () {
    const loader = document.getElementById('loading');

    loader.style.transition =
      'opacity .6s ease, transform .6s ease';

    loader.style.opacity = '0';
    loader.style.transform = 'scale(1.05)';

    setTimeout(() => {
      loader.remove();
    }, 600);
  });
</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
